name: DeLore
options:
  bundleIdPrefix: app.delore
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Staging: release
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Staging: Config/Staging.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      VALIDATE_PRODUCT: YES
    Staging:
      SWIFT_COMPILATION_MODE: wholemodule
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
packages:
  DeLoreKit:
    path: Packages/DeLoreKit
targets:
  DeLore:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: App/Info.plist
        buildPhase: none
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: Retract
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - package: DeLoreKit
        product: DeLoreCore
  DeLoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.delore.ios.tests
    dependencies:
      - target: DeLore
      - package: DeLoreKit
        product: DeLoreCore
schemes:
  DeLore:
    build:
      targets:
        DeLore: all
        DeLoreTests: [test]
    run:
      config: Debug
      storeKitConfiguration: App/StoreKit/DeLore.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - DeLoreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  DeLore-Staging:
    build:
      targets:
        DeLore: all
    run:
      config: Staging
      storeKitConfiguration: App/StoreKit/DeLore.storekit
    profile:
      config: Staging
    archive:
      config: Staging
